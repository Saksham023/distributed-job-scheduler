spring.application.name=job-scheduler-service

spring.datasource.url=jdbc:postgresql://localhost:5432/job_scheduler
spring.datasource.username=job_scheduler
spring.datasource.password=job_scheduler

app.sqs.region=ap-south-1
app.sqs.job-executions-queue-url=https://sqs.ap-south-1.amazonaws.com/837573836920/job-executions

app.watcher.enabled=false
app.watcher.interval=1m
app.watcher.lookahead=5m
app.watcher.failure-threshold=0.5