spring.application.name=job-scheduler-worker

spring.datasource.url=jdbc:postgresql://localhost:5432/job_scheduler
spring.datasource.username=job_scheduler
spring.datasource.password=job_scheduler

app.sqs.job-executions-queue-url=https://sqs.ap-south-1.amazonaws.com/837573836920/job-executions
spring.cloud.aws.region.static=ap-south-1
spring.cloud.aws.sqs.queue-not-found-strategy=fail
# Matches the queue's redrive policy (maxReceiveCount).
app.worker.max-receive-count=5

app.email.provider=smtp
app.email.from=no-reply@job-scheduler.local
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
