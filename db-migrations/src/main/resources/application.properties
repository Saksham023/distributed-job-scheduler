spring.application.name=job-scheduler-db-migrations
spring.main.web-application-type=none

spring.datasource.url=jdbc:postgresql://localhost:5432/job_scheduler
spring.datasource.username=job_scheduler
spring.datasource.password=job_scheduler

# Migrations carry template content (HTML, JSON Schema) that can contain "${";
# we don't use Flyway placeholders, so don't let Flyway try to replace them.
spring.flyway.placeholder-replacement=false
