services:
  postgres:
    image: postgres:18-alpine
    container_name: job-scheduler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: job_scheduler
      POSTGRES_PASSWORD: job_scheduler
      POSTGRES_DB: job_scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
