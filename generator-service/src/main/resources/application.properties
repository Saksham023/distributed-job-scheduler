spring.application.name=job-scheduler-generator

spring.datasource.url=jdbc:postgresql://localhost:5432/job_scheduler
spring.datasource.username=job_scheduler
spring.datasource.password=job_scheduler

app.generator.interval=1m
# Keep equal to the API's app.recurring.window.
app.generator.window=1h
# Top a schedule up once fewer than this many minutes of runs remain; must stay above
# interval + the watcher's lookahead (1m + 5m).
app.generator.refill-below=30m
app.generator.batch-size=100
